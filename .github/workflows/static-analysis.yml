name: Static Analysis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required scaffold files
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitignore
          test -f .fvmrc
          test -f CODEOWNERS
          test -f CONTRIBUTING.md
          test -f analysis_options.yaml
          test -f .editorconfig
          test -f docs/srs.md
          test -f docs/kontrak.md
          test -f docs/e2e-local.md
          test -f docs/verification.md
          test -f docs/specs/01-database.md
          test -f docs/specs/02-navigation.md
          test -f docs/specs/03-design-system.md
          test -f docs/specs/04-matkul.md
          test -f docs/specs/05-tugas.md
          test -f docs/specs/06-beranda-detail.md
          test -f docs/peta-jalan.md
          test -f .github/pull_request_template.md
          echo "scaffold ok"
      - name: No app code yet guard
        run: |
          if [ -f pubspec.yaml ]; then
            echo "pubspec found, flutter project started, static flutter checks apply in later PR"
          else
            echo "no-code stage, skip flutter"
          fi
          if [ -d lib ]; then
            echo "lib exists, ensure flutter analyze runs in follow-up workflow"
          fi
      - name: Flutter analyze when code exists
        uses: subosito/flutter-action@v2
        if: hashFiles('pubspec.yaml') != ''
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Run analyze strict
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter --version
          dart format --set-exit-if-changed .
          flutter analyze --fatal-infos --fatal-warnings
      - name: Contract tests hijau
        if: hashFiles('pubspec.yaml') != ''
        run: flutter test
      - name: Gate tanpa komentar di baris baru
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          if git diff --unified=0 FETCH_HEAD...HEAD -- \
            ':(glob)lib/**/*.dart' ':(glob)test/**/*.dart' |
            grep -E '^\+\s*(//|/\*)'; then
            echo 'hapus komentar full-line di baris baru lib/ dan test/'
            exit 1
          fi
          echo 'no-comments ok'
