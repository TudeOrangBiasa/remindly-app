name: PR Format
on:
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled]
permissions:
  pull-requests: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check title and UI screenshots
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const body = pr.body || '';
            const labels = (pr.labels || []).map(l => l.name.toLowerCase());
            const titleOk = /^\[(REM-[0-9]+[a-z]?|CHORE|DOCS)\]|^(chore|docs|feat|fix)(\(.+\))?:\s+\S/i.test(title);
            if (!titleOk) {
              core.setFailed(`Judul PR wajib diawali tag contoh [REM-12], [CHORE], [DOCS], atau chore:, docs:, feat:, fix:. Dapat: ${title}`);
              return;
            }
            const touchesUI = labels.some(n => n.includes('ui')) || /\[ui\]|\bui\b/i.test(title);
            if (touchesUI) {
              const hasImg = /!\[.*?\]\(.*?\)|<img\s/i.test(body) || /screenshot/i.test(body);
              if (!hasImg) {
                core.setFailed('PR UI wajib ada screenshot images di deskripsi PR.');
                return;
              }
            }
            if (!/checklist/i.test(body)) {
              core.setFailed('Deskripsi PR wajib memuat bagian Checklist format.');
              return;
            }
            core.info('pr format ok');
